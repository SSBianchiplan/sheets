name: Sugerir uma ideia
description: Uma função, melhoria ou recurso novo
title: "[Ideia] "
labels: ["ideia"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
      description: Conte o caso de uso. Ex.: "No Excel eu uso a função X para..."
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina a solução
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou
  - type: checkboxes
    id: ajuda
    attributes:
      label: Quer ajudar a implementar?
      options:
        - label: Sim, posso enviar um pull request
