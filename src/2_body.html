</style>
</head>
<body>
<div id="banner" role="status" hidden></div>
<header id="top">
  <div id="brand">GPlanSiS<span>|Sheets</span></div>
  <input id="fname" aria-label="Nome da pasta" value="Pasta1">
  <span id="roTag" class="tag rotag" hidden></span>
  <button id="saveSt" type="button" title="Histórico de versões" hidden></button>
  <button id="docsChip" type="button" hidden></button>
  <div id="modes" role="group" aria-label="Módulo">
    <button data-m="sheet" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/></svg><span class="mlbl2">Planilha</span></button>
    <button data-m="bi" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg><span class="mlbl2">BI</span></button>
    <button data-m="cfg" id="cfgModeB" aria-pressed="false" title="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span class="mlbl">Configurações</span></button>
  </div>
  <div id="topbtns">
    <div id="presence" aria-label="Quem mais está nesta pasta"></div>
    <button class="tb" id="shareB" title="Compartilhar esta pasta" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M19 8v6M16 11h6"/></svg><span class="lbl">Compartilhar</span></button>
    <button class="tb" id="aiB" title="Assistente de IA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg><span class="lbl">IA</span></button>
    <button class="tb ghost" id="undoB" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="tb ghost" id="redoB" title="Refazer (Ctrl+Y)" aria-label="Refazer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="tb ghost" id="themeB" title="Tema claro/escuro" aria-label="Tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg></button>
    <button class="tb" id="saveB" title="Salvar no navegador (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span class="lbl">Salvar</span></button>
    <button class="tb primary" id="fileB" title="Arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lbl">Arquivo</span></button>
    <button id="acctB" class="acctb" aria-label="Minha conta" hidden></button>
  </div>
</header>
<section class="ws" id="wsSheet">
  <nav class="ribbon"><div class="rtabs"><div id="rtabsS" class="rtabsi" role="tablist"></div><button class="rbmin" type="button" aria-label="Recolher ou expandir a faixa de ferramentas" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg></button></div><div class="rtools" id="rtoolsS"></div></nav>
  <div id="fbar"><input id="namebox" aria-label="Caixa de nome" spellcheck="false"><button id="fxbtn" title="Inserir função">fx</button><textarea id="fx" rows="1" spellcheck="false" aria-label="Barra de fórmulas"></textarea></div>
  <div id="gridHost"><canvas id="gcv"></canvas><div id="gscroll" tabindex="-1"><div id="gspacer"></div></div><textarea id="kbd" aria-label="Grade da planilha" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><textarea id="cellEd" spellcheck="false" aria-label="Editor de célula"></textarea><div id="ac" role="listbox"></div><div id="sig"></div></div>
  <div id="sbar"><button class="ibtn" id="addSheetB" title="Nova planilha" aria-label="Nova planilha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button><div id="tabsS" role="tablist"></div><div id="stat"></div><div id="zoomS"><button class="ibtn" id="zoomOut" aria-label="Diminuir zoom">−</button><button class="ibtn" id="zoomLbl" title="Voltar a 100%">100%</button><button class="ibtn" id="zoomIn" aria-label="Aumentar zoom">+</button></div></div>
</section>
<section class="ws" id="wsBI" hidden>
  <nav class="ribbon"><div class="rtabs" style="display:flex"><div id="rtabsB" style="display:flex;gap:2px"></div><button class="tb ghost" id="biSideBtn" style="margin-left:auto">Painéis</button><button class="rbmin" type="button" aria-label="Recolher ou expandir a faixa de ferramentas" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg></button></div><div class="rtools" id="rtoolsB"></div></nav>
  <div id="biMain"><nav id="biRail" aria-label="Exibições do BI"></nav><div id="biCenter"><div id="biView"></div><div id="biPages"></div></div><aside id="biSide"></aside></div>
</section>
<section class="ws" id="wsCfg" hidden>
  <div id="cfgMain"><nav id="cfgNav" aria-label="Seções de configuração"></nav><div id="cfgView"></div></div>
</section>
<div id="auth" hidden></div>
<div id="modal"></div><div id="toast" role="status"></div>
<input type="file" id="fileIn" hidden accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt,.json">
